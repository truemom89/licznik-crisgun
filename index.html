<div id="w"><div id="bg"></div>
<div class="t" id="title">SEZON CRISGUN</div>
<div class="t" id="pts">0 <small>/ 0 pkt</small></div>
<div id="bar"><div id="fill"></div></div>
<div class="t" id="pct">0%</div>
<div class="t" id="info">Brakuje: <b id="miss">0</b> · Dziennie potrzeba: <b id="daily">-</b> · <span id="tempo"></span></div>
<div id="cat"><div class="lbl">KATEGORIE</div><div id="cname">-</div><div id="cval">-</div><div id="crec"></div><div id="badge">REKORD</div></div>
</div>
<script>
/* ==== USTAWIENIA ==== */
const SHEET_ID = '1ddm-WVraMRvnIP9SMio1OXmUzA-GBHlRCaXGAxt0Jfg';
const PUB_ID = '2PACX-1vR-4cROCLBxDKhPJTYO_ghWhfJk9hm3a-eB1dmgXJci3djWa0_KJGPBa2jblUUbM4m7NMlVcOnFCNin';
/* ==================== */
const P = new URLSearchParams(location.search);
const DEMO = P.get('demo') === '1';
const REFRESH = Math.max(60, +(P.get('odswiez') || 180)) * 1000;
const SIZE = {maly: .6, sredni: .8, duzy: 1}[P.get('rozmiar') || 'duzy'] || 1;
document.getElementById('w').style.transform = `scale(${SIZE})`;
if (P.get('kategorie') === 'nie') document.getElementById('w').classList.add('nocat');

const GID = {Sezon: 0, Kategorie: 2};
const pubUrl = s => `https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=${GID[s]}&single=true&output=csv&t=${Date.now()}`;
const gvizUrl = s => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(s)}`;
async function getCSV(s){ try { const r = await fetch(pubUrl(s)); if (r.ok) { const t = await r.text(); if (!t.trim().startsWith('<')) return t; } } catch(e){} return (await fetch(gvizUrl(s))).text(); }
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}
const num = s => { if (s == null) return NaN; const x = String(s).replace(/[^\d,.\-]/g,'').replace(/[.\s](?=\d{3}\b)/g,'').replace(',', '.'); return parseFloat(x); };
const fmt = n => isNaN(n) ? '-' : Math.round(n).toLocaleString('pl-PL');

let cats = [], ci = 0;
async function load(){
  let sezon, kat;
  if (DEMO) {
    sezon = [['Aktualne punkty','34 560'],['Punkty do celu','80 000'],['Brakuje do celu','45 440'],['Potrzebne punkty dziennie','1 420'],['Tempo','Powyżej tempa'],['Postęp do celu','43,2%']];
    kat = [['Kategoria','Poprzedni sezon','Rekord przed','Rekord','Ten sezon','Status'],['Rdzenie Mocy','34','60','60','62','REKORD'],['Skarby','31','46','46','18',''],['Przemytnicy','41','60','60','27','']];
  } else {
    const [a,b] = await Promise.all([getCSV('Sezon'), getCSV('Kategorie')]);
    sezon = parseCSV(a); kat = parseCSV(b);
  }
  const m = {}; sezon.forEach(r => { if (r[0]) m[r[0].trim()] = r[1]; });
  const cur = num(m['Aktualne punkty']), goal = num(m['Punkty do celu']), miss = num(m['Brakuje do celu']), daily = num(m['Potrzebne punkty dziennie']);
  document.getElementById('pts').innerHTML = `${fmt(cur)} <small>/ ${fmt(goal)} pkt</small>`;
  const pct = goal > 0 ? Math.min(100, cur / goal * 100) : 0;
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('pct').textContent = pct.toFixed(0) + '%';
  document.getElementById('miss').textContent = miss > 0 ? fmt(miss) : 'CEL OSIĄGNIĘTY!';
  document.getElementById('daily').textContent = isNaN(daily) ? '-' : fmt(daily);
  const tempo = (m['Tempo'] || '').trim(), te = document.getElementById('tempo');
  te.textContent = tempo; te.className = tempo.startsWith('Powy') ? 'up' : tempo.startsWith('Poni') ? 'down' : '';
  cats = kat.slice(1).filter(r => r[0] && r[4] !== undefined && r[4] !== '');
}
function showCat(){
  if (!cats.length) { document.getElementById('cname').textContent = 'Start sezonu'; document.getElementById('cval').textContent=''; document.getElementById('crec').textContent=''; return; }
  const r = cats[ci++ % cats.length];
  const box = document.getElementById('cat'); box.classList.remove('fade'); void box.offsetWidth; box.classList.add('fade');
  document.getElementById('cname').textContent = r[0];
  document.getElementById('cval').textContent = r[4];
  document.getElementById('crec').textContent = 'rekord: ' + r[3];
  document.getElementById('badge').classList.toggle('on', (r[5]||'').trim() === 'REKORD');
}
async function tick(){ try { await load(); } catch(e) { console.log('Błąd odczytu tabeli', e); } }
tick().then(showCat); setInterval(tick, REFRESH); setInterval(showCat, 6000);
</script></body></html>
